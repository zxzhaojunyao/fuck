name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install (all platform binaries)
        run: bun install --os="*" --cpu="*"

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build + Package
        working-directory: packages/tui
        shell: bash
        run: |
          FUCK_TARGETS=bun-windows-x64 bun build.ts
          mkdir -p dist
          powershell -NoProfile -Command "Compress-Archive -Path 'fuck.exe' -DestinationPath 'dist/fuck-windows-x64.zip' -Force"

      - uses: actions/upload-artifact@v4
        with:
          name: fuck-windows-x64
          path: packages/tui/dist/

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: fuck-windows-x64
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
